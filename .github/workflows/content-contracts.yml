name: Validate public content contracts

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
  # Version drift almost always arrives from OUTSIDE this repo: a server
  # published to npm, a Control release cut elsewhere. A push trigger cannot
  # see any of that, so check on a clock too.
  # This cron is a scheduled DETECTOR, not a writer. It re-runs the checker
  # and leaves a red Actions run when drift exists. An npm-only
  # publish stays red until a unique-anchor docs commit lands. Do not add
  # repository_dispatch here without a typed sender, a cross-repo token, and
  # an honest pager-vs-writer contract.
  schedule:
    - cron: '17 13 * * *'   # 08:17 CT daily

permissions:
  contents: read

jobs:
  ring-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ring geometry, gesture execution, and reduced-motion regressions
        run: node --test tests/ring-3d.test.cjs

  kokoro-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reject incompatible Kokoro Python guidance
        run: python3 scripts/check-kokoro-python-contract.py

  registry-no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reject credentials in the public username registry
        run: python3 scripts/check-registry-no-secrets.py

  version-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version-drift mutation fixtures
        run: python3 scripts/test_check_version_drift.py

      - name: Public pages must match what actually ships
        run: python3 scripts/check-version-drift.py
