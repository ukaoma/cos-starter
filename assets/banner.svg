<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="50%" style="stop-color:#141428"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <linearGradient id="contextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8a87c"/>
      <stop offset="50%" style="stop-color:#d4789c"/>
      <stop offset="100%" style="stop-color:#c0a0e8"/>
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="ringGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a87c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e8a87c;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="ringGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle concentric circles (left side, offset) -->
  <circle cx="180" cy="200" r="170" fill="none" stroke="#2ecc71" stroke-width="0.5" opacity="0.2"/>
  <circle cx="180" cy="200" r="140" fill="none" stroke="#e8a87c" stroke-width="0.5" opacity="0.25"/>
  <circle cx="180" cy="200" r="110" fill="none" stroke="#9b59b6" stroke-width="0.5" opacity="0.3"/>
  <circle cx="180" cy="200" r="80" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.35"/>
  <circle cx="180" cy="200" r="50" fill="url(#ringGrad1)" stroke="#4a9eff" stroke-width="1" opacity="0.4"/>

  <!-- Ring fills -->
  <circle cx="180" cy="200" r="170" fill="url(#ringGrad4)"/>
  <circle cx="180" cy="200" r="140" fill="url(#ringGrad3)"/>
  <circle cx="180" cy="200" r="110" fill="url(#ringGrad2)"/>
  <circle cx="180" cy="200" r="80" fill="url(#ringGrad1)"/>

  <!-- Center dot -->
  <circle cx="180" cy="200" r="8" fill="#4a9eff" opacity="0.6"/>
  <circle cx="180" cy="200" r="4" fill="#fff" opacity="0.8"/>

  <!-- Small node dots on rings -->
  <circle cx="180" cy="30" r="3" fill="#2ecc71" opacity="0.5"/>
  <circle cx="320" cy="100" r="3" fill="#2ecc71" opacity="0.4"/>
  <circle cx="40" cy="120" r="3" fill="#2ecc71" opacity="0.4"/>
  <circle cx="300" cy="260" r="3" fill="#e8a87c" opacity="0.5"/>
  <circle cx="60" cy="300" r="3" fill="#e8a87c" opacity="0.4"/>
  <circle cx="250" cy="160" r="3" fill="#9b59b6" opacity="0.5"/>
  <circle cx="110" cy="130" r="3" fill="#9b59b6" opacity="0.4"/>
  <circle cx="230" cy="240" r="3" fill="#4a9eff" opacity="0.5"/>
  <circle cx="130" cy="250" r="3" fill="#4a9eff" opacity="0.4"/>

  <!-- MU Monogram -->
  <text x="600" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle" letter-spacing="2">
    <tspan fill="#ffffff">M</tspan><tspan fill="#8a8aaf">U</tspan>
  </text>

  <!-- Context is King -->
  <text x="600" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="52" text-anchor="middle">
    <tspan fill="url(#contextGrad)" font-style="normal">Context</tspan>
    <tspan fill="#ffffff" font-style="italic" dx="8"> is King</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6b6b8a" text-anchor="middle" letter-spacing="4">
    THE AI CHIEF OF STAFF
  </text>

  <!-- Tagline -->
  <text x="600" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#4a4a6a" text-anchor="middle" font-style="italic">
    "The prompt was never the problem. The model isn't the bottleneck. Your context is."
  </text>

  <!-- CTA line -->
  <text x="600" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4a9eff" text-anchor="middle" letter-spacing="1">
    milesukaoma.com/cos
  </text>

  <!-- Subtle border line at bottom -->
  <line x1="350" y1="385" x2="850" y2="385" stroke="#2a2a4a" stroke-width="1"/>
</svg>
